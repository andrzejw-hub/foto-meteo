name: Alert Foto Meteo

on:
  schedule:
    # Cron w GitHubie jest w UTC. 16:45 UTC = 18:45 latem (CEST), 17:45 UTC = 18:45 zimą (CET).
    # Skrypt sam wybiera przebieg, który w Warszawie wypada ok. 19:00 (GitHub zwykle startuje z opóźnieniem).
    - cron: "45 16,17 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Próg oceny (domyślnie 85; wpisz np. 40, żeby przetestować powiadomienie)"
        required: false
        default: ""

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Sprawdź prognozę i wyślij powiadomienie
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          THRESHOLD: ${{ github.event.inputs.threshold }}
        run: node scripts/alert.js
