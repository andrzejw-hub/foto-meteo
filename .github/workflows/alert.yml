name: Alert Foto Meteo

on:
  # Uruchamiane codziennie o 18:50 (Europe/Warsaw) z cron-job.org przez API GitHuba.
  # Harmonogram GitHuba (schedule) usunięty – startował z opóźnieniem nawet o kilka godzin.
  workflow_dispatch:
    inputs:
      threshold:
        description: "Próg oceny (domyślnie 85; wpisz np. 40, żeby przetestować powiadomienie)"
        required: false
        default: ""

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Sprawdź prognozę i wyślij powiadomienie
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          THRESHOLD: ${{ github.event.inputs.threshold }}
        run: node scripts/alert.js
